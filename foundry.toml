[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[rpc_endpoints]
domaTestnet = "${DOMA_RPC_URL}"

[etherscan]
domaTestnet = { key = "", url = "https://explorer-testnet.doma.xyz/api" }
